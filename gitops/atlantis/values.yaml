# Values chart runatlantis/atlantis 7.4.0. Nilai per-env (anotasi GSA,
# TF_VAR_project_id, GitHub App ID/slug) diisi ApplicationSet atlantis dari
# anotasi cluster.

# Image di-pin ke digest index multi-arch v0.50.0 (bukan hanya tag).
image:
  repository: ghcr.io/runatlantis/atlantis
  tag: "v0.50.0@sha256:83570c831dd301871704b02375a20914a2d14cdb3192ea66170877e4aad05832"
  pullPolicy: IfNotPresent

# Base URL tautan di komentar & status PR (repo public). Sengaja localhost:
# hostname publik tidak boleh muncul di PR, dan UI memang hanya diakses via
# kubectl -n atlantis port-forward svc/atlantis 4141:80. Webhook tidak
# memakai nilai ini (URL webhook diatur di setting repo GitHub).
atlantisUrl: http://localhost:4141

# Hanya repo ini (bukan wildcard owner).
orgAllowlist: github.com/alice101-dev/terraform-atlantis

# Mode GitHub App. githubApp.id + slug diisi ApplicationSet (anotasi cluster,
# dibaca argocd-bootstrap dari Secret Manager). Private key + webhook secret
# datang dari Secret atlantis-vcs (ExternalSecret), tidak pernah ada di values.
vcsSecretName: atlantis-vcs

# UI dilindungi basic auth (dan tidak dipublikasikan — route hanya POST /events).
basicAuthSecretName: atlantis-basic-auth

allowForkPRs: false
disableApplyAll: true
hidePrevPlanComments: true
defaultTFVersion: v1.17.2

environment:
  ATLANTIS_CHECKOUT_STRATEGY: merge
  ATLANTIS_DISCARD_APPROVAL_ON_PLAN: "true"
  ATLANTIS_ENABLE_POLICY_CHECKS: "true"
  ATLANTIS_AUTODISCOVER_MODE: disabled
  ATLANTIS_SILENCE_FORK_PR_ERRORS: "true"
  # Automerge pakai squash agar kompatibel dengan required_linear_history.
  ATLANTIS_AUTOMERGE_METHOD: squash
  # Cek mergeable mengabaikan status atlantis/apply; tanpa ini, menjadikan
  # atlantis/apply required check membuat apply deadlock (apply butuh
  # mergeable, mergeable butuh status apply).
  ATLANTIS_GH_ALLOW_MERGEABLE_BYPASS_APPLY: "true"
  CHECKPOINT_DISABLE: "1" # tanpa panggilan checkpoint-api HashiCorp (egress dibatasi)
  # Pakai conftest bawaan image (/usr/local/bin). Image mengisi
  # DEFAULT_CONFTEST_VERSION sehingga Atlantis mengunduh conftest dari GitHub
  # Releases (CDN-nya diblokir egress); nilai kosong → versi default nil →
  # fallback ke conftest di PATH (server/core/runtime/policy/conftest_client.go).
  DEFAULT_CONFTEST_VERSION: ""

# Server-side repo config: workflow & requirement TIDAK bisa di-override dari PR.
repoConfig: |
  repos:
    - id: github.com/alice101-dev/terraform-atlantis
      branch: /^main$/
      apply_requirements: [mergeable, undiverged]
      import_requirements: [mergeable, undiverged]
      workflow: guarded
      allowed_overrides: []
      allow_custom_workflows: false
      delete_source_branch_on_merge: true
      policy_check: true
      # Autodiscover dimatikan juga di sini, bukan hanya lewat flag: menurut
      # docs, key autodiscover di atlantis.yaml (dari branch PR) diabaikan bila
      # diset di server-side repo config.
      autodiscover:
        mode: disabled
      # Lock project diambil saat plan dan dilepas saat PR merge/close/unlock:
      # plan yang di-review tetap valid sampai di-apply (nilai default, ditulis
      # eksplisit).
      repo_locks:
        mode: on_plan

  workflows:
    guarded:
      plan:
        steps:
          # Hanya PR milik owner yang di-plan (repo public).
          - run: 'test "$PULL_AUTHOR" = "alice101-dev" || { echo "PR author $PULL_AUTHOR is not allowed"; exit 1; }'
          - init:
              extra_args: ["-input=false"]
          # Plan via run supaya output disensor sebelum diposting ke PR publik:
          # project ID → <project>, nomor project → <number>, baris refresh dibuang.
          # pipefail: exit code terraform tetap jadi exit code step.
          # Binary terraform tidak ada di image; Atlantis mengunduhnya sebagai
          # <distribution><versi> (mis. terraform1.17.2) ke folder yang ada di PATH.
          - run:
              command: 'set -o pipefail; "${ATLANTIS_TERRAFORM_DISTRIBUTION}${ATLANTIS_TERRAFORM_VERSION}" plan -input=false -no-color -var-file=staging.tfvars -out "$PLANFILE" 2>&1 | sed -E -e "s/${TF_VAR_project_id}/<project>/g" -e "s#(projects/|service-)[0-9]{6,}#\1<number>#g" -e "/: (Reading|Read complete after|Refreshing state)/d"'
              output: show
      policy_check:
        steps:
          - show
          - policy_check
      apply:
        steps:
          # Hanya owner yang boleh menjalankan apply.
          - run: 'test "$USER_NAME" = "alice101-dev" || { echo "user $USER_NAME is not allowed to apply"; exit 1; }'
          - run:
              command: 'set -o pipefail; "${ATLANTIS_TERRAFORM_DISTRIBUTION}${ATLANTIS_TERRAFORM_VERSION}" apply -input=false -no-color "$PLANFILE" 2>&1 | sed -E -e "s/${TF_VAR_project_id}/<project>/g" -e "s#(projects/|service-)[0-9]{6,}#\1<number>#g"'
              output: show

  policies:
    owners:
      users:
        - alice101-dev
    policy_sets:
      - name: guardrails
        path: /etc/atlantis/policies/guardrails
        source: local

# Policy rego dari ConfigMap chart config lokal.
extraVolumes:
  - name: policies
    configMap:
      name: atlantis-policies
extraVolumeMounts:
  - name: policies
    mountPath: /etc/atlantis/policies/guardrails
    readOnly: true

service:
  type: ClusterIP

ingress:
  enabled: false

test:
  enabled: false

# PV berisi file plan (bisa memuat nilai sensitif) → StorageClass CMEK.
volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: atlantis-cmek

# Atlantis tidak memakai API Kubernetes → tanpa token KSA terpasang
# (Workload Identity lewat metadata server, tidak butuh token).
serviceAccount:
  create: true
  name: atlantis
  mount: false

statefulSet:
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

# Node spot memberi ~30 detik sebelum preemption: tunggu proses terraform
# selesai selama masih ada waktu.
terminationGracePeriodSeconds: 25
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - while pgrep -x "terraform" > /dev/null; do sleep 1; done
