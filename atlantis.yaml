# Project yang dikelola Atlantis (autodiscover dimatikan di server).
# Workspace human-only SENGAJA tidak ada di sini: bootstrap, iam, service-accounts,
# kubernetes-engine, atlantis-identity, argocd-bootstrap — Atlantis tidak boleh
# mengubah IAM project, cluster tempat ia berjalan, atau haknya sendiri.
# Workflow, requirement dan policy diatur server-side (gitops/atlantis/values.yaml)
# dan tidak bisa di-override dari file ini.
version: 3
# Setelah semua project di PR berhasil di-apply, Atlantis me-merge PR (main =
# yang sudah di-apply). Merge tetap tunduk ke branch protection.
automerge: true
parallel_plan: false
parallel_apply: false
# Urutan antar project mengikuti dependensi data source by-name: grup dengan
# angka kecil jalan dulu, dan grup yang gagal membatalkan grup berikutnya.
# depends_on: apply ditolak selama dependensi yang ikut berubah di PR yang sama
# belum di-apply (plan "no changes" dianggap terpenuhi).
abort_on_execution_order_fail: true
projects:
  - name: staging-services
    execution_order_group: 1
    dir: environments/staging/services
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/services/*.tf"
  - name: staging-vpc
    execution_order_group: 2
    depends_on: [staging-services]
    dir: environments/staging/vpc
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/vpc/*.tf"
  - name: staging-cloud-nat
    execution_order_group: 3
    depends_on: [staging-vpc]
    dir: environments/staging/cloud-nat
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/cloud-nat/*.tf"
  - name: staging-firewall
    execution_order_group: 3
    depends_on: [staging-vpc]
    dir: environments/staging/firewall
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/firewall/*.tf"
  - name: staging-static-ip
    execution_order_group: 2
    depends_on: [staging-services]
    dir: environments/staging/static-ip
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/static-ip/*.tf"
  - name: staging-kms
    execution_order_group: 2
    depends_on: [staging-services]
    dir: environments/staging/kms
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/kms/*.tf"
  - name: staging-secret-manager
    execution_order_group: 3
    depends_on: [staging-kms]
    dir: environments/staging/secret-manager
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/secret-manager/*.tf"
  - name: staging-cloud-sql-postgres-app
    execution_order_group: 3
    depends_on: [staging-vpc, staging-kms]
    dir: environments/staging/cloud-sql-postgres-app
    autoplan:
