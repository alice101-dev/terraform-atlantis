name: Secret Scanning (Gitleaks)

# Separate from ci.yml because it also runs on pushes to main (a secret
# can land in ANY file, including via a direct merge), not only on PRs.
# Actions are pinned to a commit SHA (tag in the trailing comment).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action reads the PR's commit list via the API

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so Gitleaks can scan every commit in the PR
          persist-credentials: false # Gitleaks reads the local clone + API (GITHUB_TOKEN env); no persisted git creds needed (hardening)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (node24)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # This repo is owned by a personal (User) account → gitleaks-action is free,
          # no GITLEAKS_LICENSE needed. If it ever moves to an Organization, add a
          # GITLEAKS_LICENSE secret here.
