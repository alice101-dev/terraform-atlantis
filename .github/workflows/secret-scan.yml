name: Secret Scanning (Gitleaks)

# Deliberately SEPARATE from pr-checks.yml. That workflow is Terraform-path-filtered
# (minutes-frugal), but a secret can land in ANY file — so this runs on EVERY PR and
# on pushes to main, regardless of which files changed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action reads the PR's commit list via the API

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Gitleaks can scan every commit in the PR
          persist-credentials: false # Gitleaks reads the local clone + API (GITHUB_TOKEN env); no persisted git creds needed (hardening)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3 # v3 = node24 (v2 targets the deprecated node20)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # This repo is owned by a personal (User) account → gitleaks-action is free,
          # no GITLEAKS_LICENSE needed. If it ever moves to an Organization, add a
          # GITLEAKS_LICENSE secret here.
