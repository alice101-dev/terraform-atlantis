# CRD Gateway API (channel standard). Versi mengikuti dependency kgateway
# (go.mod kgateway v2.5.2 → sigs.k8s.io/gateway-api v1.7.0). GKE Gateway API
# channel dimatikan (CHANNEL_DISABLED) supaya CRD hanya punya satu pengelola.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  labels:
    layer: crds
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.7.0
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: kgateway-system # semua resource cluster-scoped; namespace hanya untuk validasi AppProject
  syncPolicy:
    automated:
      prune: false # CRD tidak di-prune otomatis — menghapus CRD menghapus semua resource-nya
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
