name: CI

# Static & logic gates that run WITHOUT GCP credentials (everything offline /
# mock). Stateful plan/apply with credentials is Atlantis' job, not this one.
#
# Every job runs on every PR (no `paths:` filter, no `if:` skip): each job is a
# required status check, and a job skipped via `if` reports "Success", which
# would let a PR merge without the check having run. Results live in the Checks
# tab and each job's run summary — no PR comment (Atlantis already comments).
on:
  pull_request:
    branches: [main]

# Read-only repo access; no GCP secrets in this lane.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  TF_IN_AUTOMATION: "1" # quieter, automation-friendly Terraform output
  # Pin tooling so CI == local (reproducible). Bump deliberately when ready.
  CHECKOV_VERSION: "3.3.7"
  TFLINT_VERSION: "v0.59.1"

jobs:
  # === Format: terraform fmt across the whole repo ===
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned Terraform version
        id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - name: Check formatting (terraform fmt -check)
        run: terraform fmt -check -recursive

  # === Validate: all workspaces in one job (loop), no backend/state ===
  validate:
    name: Validate (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned Terraform version
        id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-
      - name: Validate each workspace (init -backend=false, then validate)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          for ws in $(find environments bootstrap -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::$ws"
            if terraform -chdir="$ws" init -backend=false -input=false \
               && terraform -chdir="$ws" validate; then
              echo "| \`$ws\` | pass |" >> /tmp/validate.md
            else
              echo "| \`$ws\` | **fail** |" >> /tmp/validate.md; fail=1
            fi
            echo "::endgroup::"
          done
          { echo "### terraform validate"; echo; echo "| Workspace | Result |"; echo "|---|---|"; cat /tmp/validate.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # === Unit test: every module with tests (plan + mock_provider, offline) ===
  unit-test:
    name: Unit tests (terraform test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned Terraform version
        id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-
      - name: Run module tests (init -backend=false, then terraform test)
        run: |
          set +e # keep going so every module gets a row in the summary
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          for m in $(ls -d modules/*/tests 2>/dev/null | xargs -n1 dirname); do
            name="$(basename "$m")"
            echo "::group::$name"
            if ! terraform -chdir="$m" init -backend=false -input=false; then
              echo "::endgroup::"
              echo "| \`$name\` | **init failed** |" >> /tmp/tests.md; fail=1
              continue
            fi
            out="$(terraform -chdir="$m" test 2>&1)"; rc=$?
            echo "$out"
            echo "::endgroup::"
            counts="$(printf '%s' "$out" | grep -oE '[0-9]+ passed, [0-9]+ failed(, [0-9]+ skipped)?' | tail -1)"
            if [ $rc -eq 0 ]; then res="${counts:-pass}"; else res="**${counts:-fail}**"; fail=1; fi
            echo "| \`$name\` | $res |" >> /tmp/tests.md
          done
          { echo "### terraform test"; echo; echo "| Module | Result |"; echo "|---|---|"; cat /tmp/tests.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # === Security scan: Checkov (curated policy in .checkov.yaml) ===
  security-scan:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Checkov (pinned)
        run: pip install "checkov==${CHECKOV_VERSION}"
      - name: Scan Terraform (checkov)
        run: |
          set +e
          checkov -d . --config-file .checkov.yaml --compact | tee /tmp/ckv.txt
          code=${PIPESTATUS[0]}
          line="$(grep -aE 'Passed checks:' /tmp/ckv.txt | head -1 | sed -E 's/\x1b\[[0-9;]*m//g; s/^[[:space:]]+//')"
          { echo "### Checkov"; echo; echo "${line:-n/a}"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # === Security scan: Trivy misconfiguration (successor of tfsec) ===
  trivy:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Official image pinned by digest. Not trivy-action / setup-trivy: their
      # tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23). Checks come from
      # the bundle embedded in the image (--skip-check-update, --network none),
      # so a run never downloads code or rules.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan workspaces (with tfvars), unused modules and gitops (trivy config)
        run: |
          set +e # keep going so every target gets a row in the summary
          scan() {
            docker run --rm --network none -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" \
              config --skip-check-update --quiet --exit-code 1 "$@"
          }
          fail=0
          row() { if [ "$2" = 0 ]; then echo "| \`$1\` | pass |"; else echo "| \`$1\` | **fail** |"; fi >> /tmp/trivy.md; }
          # Each workspace with its <env>.tfvars: without it for_each maps are
          # empty and resources are invisible to the scanner.
          for ws in $(find environments bootstrap -name '*.tf' -printf '%h\n' | sort -u); do
            env="$(echo "$ws" | cut -d/ -f2)"; args=()
            [ -f "$ws/$env.tfvars" ] && args=(--tf-vars "$ws/$env.tfvars")
            echo "::group::$ws"
            scan --misconfig-scanners terraform "${args[@]}" "$ws"; rc=$?; [ $rc = 0 ] || fail=1
            echo "::endgroup::"; row "$ws" $rc
          done
          # Modules no workspace calls are not reached above; scan them directly.
          for m in modules/*/; do
            m="${m%/}"
            grep -rqs "$m\"" environments bootstrap && continue
            echo "::group::$m"
            scan --misconfig-scanners terraform "$m"; rc=$?; [ $rc = 0 ] || fail=1
            echo "::endgroup::"; row "$m" $rc
          done
          echo "::group::gitops"
          scan gitops; rc=$?; [ $rc = 0 ] || fail=1
          echo "::endgroup::"; row gitops $rc
          { echo "### Trivy config"; echo; echo "| Target | Result |"; echo "|---|---|"; cat /tmp/trivy.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # === Policy tests: conftest unit tests for the Atlantis plan guardrails ===
  policy-tests:
    name: Policy tests (conftest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Same image (digest) as the Atlantis server in gitops/atlantis/values.yaml,
      # so the bundled conftest/OPA versions match production. Keep in sync.
      ATLANTIS_IMAGE: ghcr.io/runatlantis/atlantis:v0.50.0@sha256:83570c831dd301871704b02375a20914a2d14cdb3192ea66170877e4aad05832
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: conftest verify (policies + policy-tests)
        run: |
          docker run --rm --network none \
            -v "$PWD/gitops/atlantis/config:/w:ro" -w /w \
            --entrypoint conftest "$ATLANTIS_IMAGE" \
            verify -p files/policies -p policy-tests --no-color | tee /tmp/conftest.txt
          { echo "### conftest verify"; echo; tail -1 /tmp/conftest.txt; } >> "$GITHUB_STEP_SUMMARY"

  # === Lint: TFLint across all workspaces ===
  lint:
    name: Lint (TFLint, all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # With `--chdir=<ws>` TFLint looks for `.tflint.hcl` inside that workspace;
      # point every invocation at the repo-root config instead.
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Initialize TFLint plugins
        env:
          # Authenticated plugin downloads avoid GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init
      - name: Lint each workspace (tflint)
        run: |
          fail=0
          for ws in $(find environments -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::$ws"
            tflint --chdir="$ws" -f compact || fail=1
            echo "::endgroup::"
          done
          exit $fail
