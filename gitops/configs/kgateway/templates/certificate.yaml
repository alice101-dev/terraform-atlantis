apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tlsSecretName }}
spec:
  secretName: {{ .Values.gateway.tlsSecretName }}
  dnsNames:
    - {{ required "platform.publicHostname wajib" .Values.platform.publicHostname | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.gateway.issuer }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
