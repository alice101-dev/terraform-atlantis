apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloudflare.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: {{ .Values.cloudflare.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.cloudflare.secretKey }}
      remoteRef:
        key: {{ required "platform.env wajib" .Values.platform.env }}-{{ .Values.cloudflare.remoteSecret }}
