apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.secretStore.serviceAccount }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: {{ required "platform.projectId wajib" .Values.platform.projectId }}
      auth:
        workloadIdentity:
          clusterProjectID: {{ .Values.platform.projectId }}
          clusterLocation: {{ required "platform.region wajib" .Values.platform.region }}
          clusterName: {{ required "platform.clusterName wajib" .Values.platform.clusterName }}
          serviceAccountRef:
            name: {{ .Values.secretStore.serviceAccount }}
{{- $env := required "platform.env wajib" .Values.platform.env }}
---
# Key sesuai harapan chart atlantis (vcsSecretName): github_secret, key.pem.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-vcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: atlantis-vcs
    creationPolicy: Owner
  data:
    - secretKey: key.pem
      remoteRef:
        key: {{ $env }}-atlantis-gh-app-key
    - secretKey: github_secret
      remoteRef:
        key: {{ $env }}-atlantis-gh-webhook-secret
---
# Password UI dibuat di cluster (tidak pernah lewat tangan manusia / Git / state).
# CreatedOnce: nilai tetap stabil, tidak di-generate ulang tiap refresh.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: atlantis-web-password
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-basic-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: atlantis-basic-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ .Values.webUsername | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: atlantis-web-password
