# Let's Encrypt via DNS-01 Cloudflare — tidak lewat HTTP, jadi aman di belakang
# proxy Cloudflare. Tanpa email ACME (tidak ada data pribadi di Git).
# Token dibaca dari namespace cert-manager (cluster resource namespace default).
{{- range $name, $server := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $.Values.cloudflare.secretName }}
              key: {{ $.Values.cloudflare.secretKey }}
{{- end }}
