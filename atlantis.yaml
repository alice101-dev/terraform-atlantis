        - "../../../modules/cloud-sql/*.tf"
  - name: staging-artifact-registry
    execution_order_group: 3
    depends_on: [staging-kms]
    dir: environments/staging/artifact-registry
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - ".terraform.lock.hcl"
        - "../../../modules/artifact-registry/*.tf"
  - name: staging-backup-for-gke
    execution_order_group: 3
    depends_on: [staging-kms]
    dir: environments/staging/backup-for-gke
