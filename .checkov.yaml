# ---------------------------------------------------------------------------
# Checkov policy — security gate CI (BLOCKING).
#
# Skip resource-spesifik (Terraform) TIDAK di sini — masing-masing dipasang
# inline `# checkov:skip=<ID>: <alasan>` DI resource-nya, agar check tetap AKTIF
# untuk resource lain & resource baru (coverage penuh, tetap menangkap regresi).
#
# Daftar di bawah HANYA untuk hal yang benar-benar global/lintas-file:
#   - Scanner GitHub Actions: noise untuk workflow offline TF-check (tak ada
#     build artifact, cosign, curl/nc, dll).
#   - Satu false-positive secret pada TEKS DOKUMENTASI (komentar contoh).
# checkov tetap MEMBLOKIR temuan lain di luar daftar ini.
# ---------------------------------------------------------------------------

compact: true

skip-check:
  # GitHub Actions scanner — tak berlaku untuk workflow offline TF-check ini
  - CKV_GHA_1   # ACTIONS_ALLOW_UNSECURE_COMMANDS — tak diset
  - CKV_GHA_2   # shell injection — bash tak memakai input tak-tepercaya
  - CKV_GHA_3   # curl with secrets — tak ada curl
  - CKV_GHA_4   # netcat with IP — tak ada nc
  - CKV_GHA_5   # cosign sign — tak ada build artifact
  - CKV_GHA_6   # cosign sbom — idem
  - CKV_GHA_7   # workflow_dispatch inputs — tak ada workflow_dispatch
  - CKV2_GHA_1  # top-level permissions — di-set read; varian graph noise
  # Secret scanner — false positive pada teks dokumentasi
  - CKV_SECRET_6 # "Base64 high entropy" pada KOMENTAR contoh (nama secret, bukan nilai); heuristik base64 lain tetap aktif
