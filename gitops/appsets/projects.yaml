# AppProject platform: hanya sumber yang dipakai komponen gitops/ dan hanya
# namespace platform. Sumber/namespace baru = tambah di sini lewat PR.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform controllers and their configuration (secrets, certificates, gateway, Atlantis)
  sourceRepos:
    - https://github.com/alice101-dev/terraform-atlantis.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - cr.kgateway.dev/kgateway-dev/charts
    - https://runatlantis.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kgateway-system
    - server: https://kubernetes.default.svc
      namespace: atlantis
  # Resource cluster-scoped (CRD, ClusterRole, ClusterIssuer, GatewayClass) dicek lewat whitelist ini.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
